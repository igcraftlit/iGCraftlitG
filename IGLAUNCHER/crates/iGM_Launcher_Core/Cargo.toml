# 文件路径：crates/iGM_Launcher_Core/Cargo.toml
# 所属层：Rust 原生核心 / 构建清单
# 模块：iGM_Launcher_Core
# 作用：声明原生核心的包信息与 cdylib 产物类型，编译结果供 bun:ffi 动态加载
# 内容：包元信息、lib 目标（cdylib + rlib）、无外部依赖

[package]
name = "igm-launcher-core"
version = "0.1.0"
edition = "2021"
description = "iGM Launcher native core (interface placeholder)"
license = "UNLICENSED"
publish = false

[lib]
# 动态库名固定为 igm_launcher_core，Rust 侧导入符号使用 iGM_Launcher_ 前缀
name = "igm_launcher_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# 模块四说明：微软认证链前三步（MSA 设备代码 / Xbox Live / XSTS）的真实 HTTPS 调用
# 当前由 apps/shell/src/iGM_Launcher_MsaAuth.ts 在 Bun 侧承载，故此处保持零外部依赖；
# 待原生实现落地时再引入 reqwest（blocking）或 tokio，避免登记未使用的依赖。
[dependencies]