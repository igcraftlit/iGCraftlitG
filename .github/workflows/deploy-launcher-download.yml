# 文件路径：.github/workflows/deploy-launcher-download.yml
# 所属层：CI/CD / GitHub Actions
# 路由：无（流水线，非页面路由）
# 模块：iGM_DeployLauncherDownload
# 作用：推送 main 分支时自动构建启动器下载站（launcher.igcraftlit.com）并部署到 Cloudflare Pages
# 内容：检出代码 / 安装 Bun / bun install / 构建纯静态产物 apps/launcher-download/out /
#       wrangler pages deploy 直传 Pages 项目 iGM-Launcher-Download（生产分支 main）

name: Deploy Launcher Download

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-launcher-download
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy (launcher.igcraftlit.com)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建纯静态站点
        run: bun run --cwd apps/launcher-download build

      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 pages deploy apps/launcher-download/out --project-name=igm-craftceon-launcher --branch=main