# 文件路径：.github/workflows/deploy-exam-web.yml
# 所属层：CI/CD / GitHub Actions
# 路由：无（流水线，非页面路由）
# 模块：iGM_DeployExamWeb
# 作用：推送 main 分支时自动构建教育考试子站点（exam.igcraftlit.com）并部署到 Cloudflare Pages
# 内容：检出代码 / 安装 Bun / bun install / 构建纯静态产物 apps/exam/out /
#       wrangler pages deploy 直传 Pages 项目 igm-exam（生产分支 main）
#
# 说明：站点目录为 apps/exam，对外域名 exam.igcraftlit.com；
#       api.igcraftlit.com 是本机后端经 cloudflared 隧道暴露的 API 域名，不是 Pages 站点。

name: Deploy Exam Web

on:
  push:
    branches:
      - main
    paths:
      - "apps/exam/**"
      - ".github/workflows/deploy-exam-web.yml"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: deploy-exam-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy (exam.igcraftlit.com)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建纯静态站点
        run: bun run --cwd apps/exam build

      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 pages deploy apps/exam/out --project-name=igm-exam --branch=main
