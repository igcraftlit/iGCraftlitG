# 文件路径：.github/workflows/release-launcher.yml
# 所属层：CI/CD / GitHub Actions
# 路由：无（流水线，非页面路由）
# 模块：iGM_ReleaseLauncher
# 作用：推送 v* tag 时自动打包 iGM CraftCeon Launcher（Windows）并上传到 GitHub Releases
# 内容：检出代码 / 安装 Bun 与 Zig / IGLAUNCHER 内安装依赖 /
#       执行完整打包链 build:installer（Zig 核心 → UI → 外壳 → 绿色版 → 安装器载荷 → 安装程序）/
#       将 apps/installer/artifacts 下的安装包与载荷上传为 Release 附件
#
# 说明：
# 1. IGLAUNCHER 是本仓库的子目录（无独立 .git），因此流水线必须放在仓库根的 .github/workflows。
# 2. 仅构建 Windows 平台：shell / installer 的 electrobun.config.ts 只声明了 win 图标与 win-x64 产物，
#    仓库现有产物也只有 stable-win-x64，macOS(.dmg) 需另行验证后再加入构建矩阵。
# 3. 产物文件名已含版本号（iGM-CraftCeon-Launcher-Setup-<版本>.zip），与下载站 release.json 约定一致。

name: Release Launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Release (Windows x64)
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装 Zig
        uses: mlugg/setup-zig@v2
        with:
          # 与 zig-core/build.zig.zon 的 minimum_zig_version 保持一致
          version: 0.16.0

      - name: 安装启动器依赖
        working-directory: IGLAUNCHER
        run: bun install --frozen-lockfile

      - name: 打包安装程序
        working-directory: IGLAUNCHER
        # 完整打包链：build:zig → build:ui → sync:ui → shell build → portable → sync:installer → installer build
        run: bun run build:installer

      - name: 上传安装包到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            IGLAUNCHER/apps/installer/artifacts/*.zip
            IGLAUNCHER/apps/installer/artifacts/*.tar.zst
            IGLAUNCHER/apps/installer/artifacts/*.json
          fail_on_unmatched_files: true