# 文件路径：.github/workflows/deploy-cli-web.yml
# 所属层：CI/CD / GitHub Actions
# 路由：无（流水线，非页面路由）
# 模块：iGM_DeployCliWeb
# 作用：推送 main 分支时自动构建 CLI / SDK 文档站（cli.igcraftlit.com）并部署到 Cloudflare Pages
# 内容：检出代码 / 安装 Bun / bun install / 构建纯静态产物 apps/cli-download/out /
#       wrangler pages deploy 直传 Pages 项目 iGM-CLI-Download（生产分支 main）
#
# 说明：站点目录为 apps/cli-download，对外域名 cli.igcraftlit.com；
#       api.igcraftlit.com 是本机后端经 cloudflared 隧道暴露的 API 域名，不是 Pages 站点。

name: Deploy CLI Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cli-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy (cli.igcraftlit.com)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建纯静态站点
        run: bun run --cwd apps/cli-download build

      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 pages deploy apps/cli-download/out --project-name=igm-cli-download --branch=main