[package]
name = "igm_core"
version = "26.5.4"
edition = "2021"
description = "iGM CraftCeon Launcher native core sidecar (stdio JSON bridge over Tokio)"
license = "MIT"
publish = false

[[bin]]
name = "igm_core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
